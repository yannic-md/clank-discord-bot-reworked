name: Locales

on:
  push:
    branches: [ "**" ]
    paths:
      - "locales/**"
      - "../../scripts/locales/check_command_locales.py"
      - "../../scripts/locales/check_locale_completeness.py"
      - "core/discord_api/limits.py"
      - "core/enums/language.py"
  pull_request:
    branches: [ "**" ]
    paths:
      - "locales/**"
      - "../../scripts/locales/check_command_locales.py"
      - "../../scripts/locales/check_locale_completeness.py"
      - "core/discord_api/limits.py"
      - "core/enums/language.py"

jobs:
  verify-locales:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check slash command translation limits
        run: python -m scripts.locales.check_command_locales

      - name: Check translation completeness (translation line diff)
        run: python -m scripts.locales.check_locale_completeness
